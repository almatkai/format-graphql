[package]
name = "format-graphql-host-harness"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
[lib]
doctest = false
[dependencies]
tezbar-format-graphql = { path = "../.." }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.18.1", features = ["v4"] }
tempfile = "=3.23.0"
log = "=0.4.28"
