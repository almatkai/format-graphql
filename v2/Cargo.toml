[package]
name = "tezbar-format-graphql"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Offline compiled-in GraphQL formatter for Tezbar Native V2"
include = ["src/**", "tests/**", "adapter/**", "fixtures/**", "assets/**", "scripts/**", "integration/**", "/*.json", "/*.md", "/LICENSE*", "/Cargo.lock", "!fixtures/**/node_modules/**", "!fixtures/**/dist/**", "!fixtures/**/Cargo.toml", "!fixtures/library/prettier-2.8.8.tgz"]

[dependencies]
apollo-parser = "=0.8.5"
unicode-width = "=0.2.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "=3.23.0"
uuid = { version = "=1.18.1", features = ["v4"] }
log = "=0.4.28"
